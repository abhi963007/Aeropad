name: aeropad
description: AeroPad ultra-low latency Wi-Fi trackpad and mouse for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#090A0C"
  adaptive_icon_foreground: "assets/app_icon_adaptive_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
